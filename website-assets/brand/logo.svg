<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background polygon -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="url(#primary-grad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Outer Hexagon Border -->
  <polygon points="100,22 168,61 168,139 100,178 32,139 32,61" stroke="url(#primary-grad)" stroke-width="4" stroke-linejoin="round" fill="none"/>

  <!-- Isometric Cube -->
  <polygon points="100,38 150,67 100,96 50,67" fill="url(#cube-top)" opacity="0.95"/>
  <polygon points="50,67 100,96 100,154 50,125" fill="url(#cube-left)" opacity="0.9"/>
  <polygon points="100,96 150,67 150,125 100,154" fill="url(#cube-right)" opacity="0.95"/>

  <!-- Inner Tech Core / 3BX Symbol -->
  <path d="M72,112 L72,82 Q86,82 86,97 Q86,112 72,112 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128,82 L106,112 M106,82 L128,112" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
</svg>
